name: Deploy project to AI-SDK.PRO
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: aisdk-project-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build with network disabled and no inherited secrets
        run: bash infra/sandbox-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aisdk-static-site
          path: site.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    environment:
      name: production
      url: https://urban-couscous.ai-sdk.pro/
    env:
      SITE_URL: https://urban-couscous.ai-sdk.pro
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aisdk-static-site
      - name: Send authenticated deploy webhook
        shell: bash
        run: |
          set -euo pipefail
          audience="$(jq -nr --arg url "$SITE_URL" '$url|@uri')"
          token="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -er .value)"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-binary @site.json "$SITE_URL/_aisdk/deploy"
      - name: Verify published commit and homepage
        shell: bash
        run: |
          set -euo pipefail
          deployed="$(curl -fsS --max-time 15 "$SITE_URL/_aisdk/status" | jq -er .commit)"
          test "$deployed" = "$GITHUB_SHA"
          curl -fsS --max-time 15 -o /dev/null "$SITE_URL/"
          printf '[Published project](%s/) at commit `%s`\n' "$SITE_URL" "$deployed" >> "$GITHUB_STEP_SUMMARY"
