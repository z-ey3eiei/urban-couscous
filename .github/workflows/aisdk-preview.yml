name: AI SDK static preview
run-name: AI SDK preview · ${{ inputs.delivery || github.sha }}
on:
  push:
    branches: [aisdk/preview-pilot]
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
      slot:
        required: true
        type: string
      delivery:
        required: true
        type: string

permissions: {}
concurrency:
  group: aisdk-preview-${{ inputs.slot || github.ref }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'push' && github.repository_id == '1458143895' && github.ref == 'refs/heads/aisdk/preview-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Verify staging recorded the pushed commit
        shell: bash
        run: |
          set -euo pipefail
          endpoint=https://staging.ai-sdk.pro/api/github/webhook
          audience="$(jq -nr --arg url "$endpoint" '$url|@uri')"
          for attempt in $(seq 1 20); do
            token="$(curl -fsS --max-time 10 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$audience" | jq -er .value)"
            echo "::add-mask::$token"
            code="$(curl -sS --max-time 10 -o "$RUNNER_TEMP/intake.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -X POST "$endpoint")"
            if [[ "$code" == 202 ]] && jq -e '.accepted and .received' "$RUNNER_TEMP/intake.json" >/dev/null; then
              echo "Verified the pushed commit was recorded in staging."
              exit 0
            fi
            if [[ "$code" != 400 && "$code" != 503 && "$code" != 401 ]]; then
              if [[ "$code" == 401 ]]; then
                OIDC_DIAGNOSTIC="$token" python3 - <<'PY'
          import os,base64,json,time
          token=os.environ['OIDC_DIAGNOSTIC']
          enc=token.split('.')[1]
          c=json.loads(base64.urlsafe_b64decode(enc+'='*((-len(enc))%4)))
          repo='z-ey3eiei/urban-couscous'
          ref='refs/heads/aisdk/preview-pilot'
          expect={'iss':'https://token.actions.githubusercontent.com','aud':'https://staging.ai-sdk.pro/api/github/webhook','sub':f'repo:{repo}:ref:{ref}','repository':repo,'repository_id':'1458143895','event_name':'push','ref':ref,'workflow_ref':f'{repo}/.github/workflows/aisdk-preview.yml@{ref}'}
          print('OIDC claim checks:',json.dumps({**{k:c.get(k)==v for k,v in expect.items()},'workflow_sha_matches':c.get('workflow_sha')==c.get('sha'),'has_iat':isinstance(c.get('iat'),int),'has_nbf':isinstance(c.get('nbf'),int),'valid_lifetime':0<c.get('exp',0)-time.time()<=600}))
          PY
                jq -c '{error}' "$RUNNER_TEMP/intake.json"
              fi
              echo "Staging intake returned HTTP $code without confirming a new job."
              exit 1
            fi
            sleep 12
          done
          jq -c '{error}' "$RUNNER_TEMP/intake.json"
          echo "Staging intake did not become available."
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Verify preview inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          SLOT: ${{ inputs.slot }}
          DELIVERY: ${{ inputs.delivery }}
        run: |
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SLOT" =~ ^preview-[a-f0-9]{20}$ ]]
          [[ "$DELIVERY" =~ ^[a-fA-F0-9-]{36}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: source
          persist-credentials: false
      - name: Build pinned commit in the pilot sandbox
        working-directory: source
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          bash ../control/infra/sandbox-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: source/site.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: aisdk-preview
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: preview-site
      - name: Validate and extract static assets
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re
          source = pathlib.Path('site.json')
          assert source.stat().st_size <= 8_000_002
          assets = json.loads(source.read_bytes())
          assert isinstance(assets, dict) and 'index.html' in assets and len(assets) <= 300
          output = pathlib.Path('preview-assets')
          output.mkdir()
          allowed = {'html', 'css', 'js', 'mjs', 'json', 'svg', 'png', 'jpg', 'jpeg', 'webp', 'ico', 'woff2'}
          total = 0
          for name, encoded in assets.items():
              assert isinstance(encoded, str) and len(name) <= 240
              assert all(re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9_.@-]*', part) for part in name.split('/'))
              assert name == 'robots.txt' or name.rsplit('.', 1)[-1] in allowed
              data = base64.b64decode(encoded, validate=True)
              total += len(data)
              assert total <= 6_000_000
              target = output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          (output / '_aisdk-commit.json').write_text(json.dumps({'commit': os.environ['COMMIT']}))
          PY
      - name: Publish and verify preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SLOT: ${{ inputs.slot }}
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{1,57}$ ]]
          [[ "$SLOT" =~ ^preview-[a-f0-9]{20}$ ]]
          : "${CLOUDFLARE_API_TOKEN:?Configure the preview publisher credential}"
          npx --yes wrangler@4.162.0 pages deploy preview-assets \
            --project-name "$PAGES_PROJECT" --branch "$SLOT" --commit-hash "$COMMIT"
          url="https://$SLOT.$PAGES_PROJECT.pages.dev"
          for attempt in $(seq 1 15); do
            actual="$(curl -fsS --max-time 8 "$url/_aisdk-commit.json" | jq -r .commit || true)"
            if [[ "$actual" == "$COMMIT" ]]; then
              curl -fsS --max-time 8 -o /dev/null "$url/"
              printf '[Preview](%s/) · `%s`\n' "$url" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo 'Preview URL did not serve the expected commit.' >&2
          exit 1
